<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>
    {%- include header.html -%}

    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
      ☰
    </button>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {%- include sidebar.html -%}
        <div class="main-content">
          {{ content }}
        </div>
      </div>
    </main>

    {%- include footer.html -%}
    {%- include cookie-consent.html -%}

    <script>
      // Mobile menu toggle
      const menuToggle = document.getElementById('mobileMenuToggle');
      const sidebar = document.querySelector('.sidebar');
      
      menuToggle.addEventListener('click', function() {
        sidebar.classList.toggle('open');
        document.body.classList.toggle('menu-open');
        menuToggle.textContent = sidebar.classList.contains('open') ? '✕' : '☰';
      });

      // Close menu when clicking on a link
      const sidebarLinks = document.querySelectorAll('.sidebar a');

      // Highlight the current chapter and make sure it is visible in the sidebar
      sidebarLinks.forEach(link => {
        if (link.getAttribute('href') === window.location.pathname && link.closest('.sidebar-nav')) {
          link.classList.add('active');
          link.setAttribute('aria-current', 'page');
          if (window.innerWidth > 800 && sidebar.scrollHeight > sidebar.clientHeight) {
            sidebar.scrollTop = link.offsetTop - sidebar.clientHeight / 2;
          }
        }
      });
      sidebarLinks.forEach(link => {
        link.addEventListener('click', function() {
          if (window.innerWidth <= 800) {
            sidebar.classList.remove('open');
            document.body.classList.remove('menu-open');
            menuToggle.textContent = '☰';
          }
        });
      });

      // Close menu when clicking on overlay
      document.addEventListener('click', function(event) {
        if (document.body.classList.contains('menu-open') && 
            !sidebar.contains(event.target) && 
            event.target !== menuToggle) {
          sidebar.classList.remove('open');
          document.body.classList.remove('menu-open');
          menuToggle.textContent = '☰';
        }
      });

      // Scroll guard for embedded players: the page scrolls over them until they are clicked
      document.querySelectorAll('.main-content iframe').forEach(frame => {
        const wrapper = document.createElement('span');
        wrapper.className = 'player-guard';
        frame.parentNode.insertBefore(wrapper, frame);
        wrapper.appendChild(frame);

        const overlay = document.createElement('button');
        overlay.type = 'button';
        overlay.className = 'player-guard-overlay';
        overlay.setAttribute('aria-label', 'Activate interactive statechart');
        overlay.innerHTML = '<span class="player-guard-hint">Click to interact</span>';
        wrapper.appendChild(overlay);

        overlay.addEventListener('click', () => {
          wrapper.classList.add('active');
          frame.focus();
        });
        wrapper.addEventListener('mouseleave', () => wrapper.classList.remove('active'));
      });

      // Touch devices have no mouseleave: guard again when tapping outside the player
      document.addEventListener('pointerdown', event => {
        document.querySelectorAll('.player-guard.active').forEach(wrapper => {
          if (!wrapper.contains(event.target)) wrapper.classList.remove('active');
        });
      });
    </script>
  </body>

</html>
